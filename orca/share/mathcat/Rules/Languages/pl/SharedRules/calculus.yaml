[{name: laplacian,tag: laplacian,match: count(*) <= 1,replace: [{t: laplasjan},{test: {if: count(*) = 1,then: [{test: {if: "$Verbosity!='Terse'",then: [{T: z}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}}]},{name: divergence,tag: divergence,match: count(*) = 1,replace: [{test: {if: "$Verbosity='Terse'",then: [{t: dywergencja}],else: [{t: dywergencja z}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: curl,tag: curl,match: count(*) = 1,replace: [{t: rotacja},{test: {if: "$Verbosity!='Terse'",then: [{T: z}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: gradient,tag: gradient,match: count(*) = 1,replace: [{test: {if: "$Verbosity!='Terse'",then: [{t: gradient z}],else: [{t: gradient}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}]
