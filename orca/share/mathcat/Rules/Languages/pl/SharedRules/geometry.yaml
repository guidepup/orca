[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: odcinek od},{x: "*[1]"},{T: do},{x: "*[2]"}],else: [{t: odcinek},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: półprosta od},{x: "*[1]"},{T: do},{x: "*[2]"}],else: [{t: półprosta},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{T: łuk},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: miara kąta}],else: [{t: miara kąta}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]},{name: coordinate,tag: coordinate,match: ".",replace: [{T: przecinek},{test: {if: "$Verbosity='Verbose'",then: [{t: w}]}},{pause: short},{insert: {nodes: "*",replace: [{T: przecinek},{pause: auto}]}},{pause: short},{test: {if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))",then: [{t: punkt końcowy}]}}]}]
