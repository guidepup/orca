[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: jana},{x: "*[1]"},{T: ""},{x: "*[2]"}],else: [{T: jana},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: puolisuora},{x: "*[1]"},{T: ""},{x: "*[2]"}],else: [{T: puolisuora},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: ""}]}},{T: kaari},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: kulman suuruus}],else: [{T: kulman suuruus}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]}]
