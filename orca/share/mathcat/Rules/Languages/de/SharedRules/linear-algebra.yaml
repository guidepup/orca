[{name: scalar-determinant,tag: determinant,match: "count(*)=1 and not(*[1][self::m:mtr])",replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: die}]}},{T: determinante},{test: {if: "$Verbosity!='Terse'",then: [{T: von}]}},{x: "*[1]"},{test: {if: "not(IsNode(*[1], 'simple')) and $Impairment = 'Blindness'",then: [{T: ende der determinante}]}}]},{name: subscripted-norm,tag: subscripted-norm,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: die}]}},{x: "*[2]"},{T: norm},{test: {if: "$Verbosity!='Terse'",then: [{T: von}]}},{x: "*[1]"}]}]
