[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: die strecke von},{x: "*[1]"},{T: nach},{x: "*[2]"}],else: [{T: strecke},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: der strahl von},{x: "*[1]"},{T: nach},{x: "*[2]"}],else: [{T: strahl},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: der}]}},{T: bogen},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: das maß des winkels}],else: [{T: maß für den winkel}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]},{name: coordinate,tag: coordinate,match: ".",replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: der}]}},{T: punkt},{test: {if: "$Verbosity='Verbose'",then: [{T: bei}]}},{pause: short},{insert: {nodes: "*",replace: [{T: komma},{pause: auto}]}},{pause: short},{test: {if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))",then: [{T: ende des punktes}]}}]}]
