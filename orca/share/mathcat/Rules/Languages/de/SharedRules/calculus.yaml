[{name: laplacian,tag: laplacian,match: count(*) <= 1,replace: [{T: Laplace-Operator},{test: {if: count(*) = 1,then: [{test: {if: "$Verbosity!='Terse'",then: [{T: von}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}}]},{name: divergence,tag: divergence,match: ".",replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: divergenz}],else: [{t: div}]}},{t: von},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: curl,tag: curl,match: count(*) = 1,replace: [{T: Rotation},{test: {if: "$Verbosity!='Terse'",then: [{T: von}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: gradient,tag: gradient,match: ".",replace: [{test: {if: "$Verbosity!='Terse'",then: [{t: gradient von}],else: [{t: grad}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}]
