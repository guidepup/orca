[{name: overview-default,tag: [mfrac,fraction],match: ".",replace: [{test: {if: "IsNode(*[1], 'simple') and IsNode(*[2], 'simple')",then: [{x: "*[1]"},{T: genom},{x: "*[2]"}],else: [{T: bråk}]}}]},{name: overview-default,tag: [msqrt,square-root],match: ".",replace: [{T: roten},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: ur}]}},{x: "*[1]"}]}}]},{name: overview-default,tag: [mroot,root],match: ".",replace: [{test: {if: "*[2][self::m:mn]",then_test: [{if: "*[2][.='2']",then: [{T: kvadratroten}]},{else_if: "*[2][.='3']",then: [{T: kubikroten}]},{else_if: "*[2][not(contains(., ','))]",then: [{x: "ToOrdinal(*[2])"},{T: roten}]}],else: [{T: roten av grad},{x: "*[2]"}]}},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: ur}]}},{x: "*[1]"}]}}]},{name: matrix-override,tag: mrow,match: ["*[2][self::m:mtable] and","(IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|'))"],replace: [{x: "count(*[2]/*)"},{T: gånger},{x: "count(*[2]/*[self::m:mtr][1]/*)"},{test: {if: "*[1][.='|']",then: [{T: determinant}],else: [{T: matris}]}}]},{name: overview-default,tag: mtable,match: ".",replace: [{x: "count(*[2]/*)"},{T: gånger},{x: "count(*[2]/*[self::m:mtr][1]/*)"},{T: tabell}]},{name: short-mrow,tag: mrow,match: count(*)<6,replace: [{insert: {nodes: "*",replace: [{pause: auto}]}}]},{name: long-mrow,tag: mrow,match: ".",replace: [{x: "*[1]"},{pause: auto},{x: "*[2]"},{pause: auto},{x: "*[3]"},{pause: auto},{x: "*[4]"},{pause: auto},{x: "*[5]"},{pause: auto},{T: och så vidare}]},{include: SimpleSpeak_Rules.yaml}]
