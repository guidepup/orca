[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: linje-segmentet från},{x: "*[1]"},{T: till},{x: "*[2]"}],else: [{T: linje-segmentet},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: den riktade sträckan från},{x: "*[1]"},{T: till},{x: "*[2]"}],else: [{T: den riktade sträckan},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{T: bågen},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: måttet på vinkeln}],else: [{T: vinkeln}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]},{name: coordinate,tag: coordinate,match: ".",replace: [{T: punkten},{test: {if: "$Verbosity='Verbose'",then: [{T: vid}]}},{pause: short},{insert: {nodes: "*",replace: [{T: komma},{pause: auto}]}},{pause: short},{test: {if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))",then: [{T: slut punkt}]}}]}]
