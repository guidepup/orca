[{name: scalar-determinant,tag: determinant,match: "count(*)=1 and not(*[1][self::m:mtr])",replace: [{T: determinanten},{test: {if: "$Verbosity!='Terse'",then: [{T: av}]}},{x: "*[1]"},{test: {if: "not(IsNode(*[1], 'simple'))",then: [{T: slut determinant}]}}]},{name: subscripted-norm,tag: subscripted-norm,match: count(*)=2,replace: [{x: "*[2]"},{T: normen},{test: {if: "$Verbosity!='Terse'",then: [{T: av}]}},{x: "*[1]"}]},{name: homomorphism,tag: homomorphism,match: count(*)=1,replace: [{test: {if: "$Verbosity!='Terse'",then: [{T: mängden av endomorfismer på}],else: [{T: endomorfismerna på}]}},{x: "*[1]"},{test: {if: "$Impairment = 'Blindness' and not(*[last()][IsBracketed(., '', '') or IsNode(., 'simple')] )",then: [{T: slut endomorfismerna}]}},{test: {if: "IsNode(., '2D')",then: [{pause: short}],else: [{pause: auto}]}}]},{name: kernel,tag: kernel,match: count(*)=1,replace: [{T: noll-rummet},{test: {if: "$Verbosity!='Terse'",then: [{T: till}]}},{x: "*[1]"},{test: {if: "$Impairment = 'Blindness' and not(*[last()][IsBracketed(., '', '') or IsNode(., 'simple')] )",then: [{T: slut noll-rummet}]}},{test: {if: "IsNode(., '2D')",then: [{pause: short}],else: [{pause: auto}]}}]}]
