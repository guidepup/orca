[{name: laplacian,tag: laplacian,match: count(*) <= 1,replace: [{T: LahPlahsian},{test: {if: count(*) = 1,then: [{test: {if: "$Verbosity!='Terse'",then: [{T: ""}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}}]},{name: divergence,tag: divergence,match: count(*) = 1,replace: [{test: {if: "$Verbosity='Terse'",then: [{T: div}],else: [{T: divergence}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: curl,tag: curl,match: count(*) = 1,replace: [{T: curl},{test: {if: "$Verbosity!='Terse'",then: [{t: ""}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: gradient,tag: gradient,match: count(*) = 1,replace: [{test: {if: "$Verbosity!='Terse'",then: [{T: gradient}],else: [{T: del}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}]
