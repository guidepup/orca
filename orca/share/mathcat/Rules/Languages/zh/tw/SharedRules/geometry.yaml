[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: 線段},{x: "*[1]"},{T: 到},{x: "*[2]"}],else: [{T: 線段},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: 射線},{x: "*[1]"},{T: 到},{x: "*[2]"}],else: [{T: 射線},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: ""}]}},{T: 弧},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: 角度的度量}],else: [{T: 角度的度量}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]},{name: coordinate,tag: coordinate,match: ".",replace: [{test: {if: "$Verbosity='Verbose'",then: [{OT: ""}]}},{T: 點},{test: {if: "$Verbosity='Verbose'",then: [{T: 在}]}},{pause: short},{insert: {nodes: "*",replace: [{T: 逗號},{pause: auto}]}},{pause: short},{test: {if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))",then: [{T: 結束點}]}}]}]
