[{name: overview-default,tag: [mfrac,fraction],match: ".",replace: [{test: {if: "IsNode(*[1], 'simple') and IsNode(*[2], 'simple')",then: [{x: "*[2]"},{T: 分之},{x: "*[1]"}],else: [{T: 分數}]}}]},{name: overview-default,tag: [msqrt,square-root],match: ".",replace: [{T: 根號},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: ""}]}},{x: "*[1]"}]}}]},{name: overview-default,tag: [mroot,root],match: ".",replace: [{T: ""},{x: "*[1]"},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: 的}]}}]}},{test: {if: "*[2][self::m:mn]",then_test: [{if: "*[2][.='2']",then: [{T: 平方根}]},{else_if: "*[2][.='3']",then: [{T: 立方根}]},{else_if: "*[2][not(contains(., '.'))]",then: [{x: "*[2]"},{T: 次方根}]},{else: [{x: "*[2]"},{T: 次方根}]}],else: [{test: {if: "*[2][self::m:mi][string-length(.)=1]",then: [{x: "*[2]"}],else: [{x: "*[2]"}]}},{T: 次方根}]}}]},{name: matrix-override,tag: mrow,match: ["*[2][self::m:mtable] and","(IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|'))"],replace: [{T: ""},{x: "count(*[2]/*)"},{T: 乘},{x: "count(*[2]/*[self::m:mtr][1]/*)"},{test: {if: "*[1][.='|']",then: [{T: 行列式}],else: [{T: 矩陣}]}}]},{name: overview-default,tag: mtable,match: ".",replace: [{T: ""},{x: "count(*[2]/*)"},{T: 乘},{x: "count(*[2]/*[self::m:mtr][1]/*)"},{T: 表格}]},{name: short-mrow,tag: mrow,match: count(*)<6,replace: [{insert: {nodes: "*",replace: [{pause: auto}]}}]},{name: long-mrow,tag: mrow,match: ".",replace: [{x: "*[1]"},{pause: auto},{x: "*[2]"},{pause: auto},{x: "*[3]"},{pause: auto},{x: "*[4]"},{pause: auto},{x: "*[5]"},{pause: auto},{T: 等等}]},{include: SimpleSpeak_Rules.yaml}]
