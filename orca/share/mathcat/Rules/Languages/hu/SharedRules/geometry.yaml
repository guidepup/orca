[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: "a vonalszakasz innen:"},{x: "*[1]"},{T: "eddig:"},{x: "*[2]"}],else: [{T: vonalszakasz},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: "a sugár innen:"},{x: "*[1]"},{T: "ide:"},{x: "*[2]"}],else: [{T: sugár},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: az}]}},{T: ív},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: a szög mértéke}],else: [{T: szög mértéke}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]},{name: coordinate,tag: coordinate,match: "not(*[@arg])",replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: a}]}},{T: pont},{test: {if: "$Verbosity='Verbose'",then: [{T: a}]}},{pause: short},{insert: {nodes: "*",replace: [{T: vessző},{pause: auto}]}},{pause: short},{test: {if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))",then: [{T: végpont}]}}]}]
