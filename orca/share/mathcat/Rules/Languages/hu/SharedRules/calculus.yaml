[{name: laplacian,tag: laplacian,match: count(*) <= 1,replace: [{T: laplaciánus},{test: {if: count(*) = 1,then: [{test: {if: "$Verbosity!='Terse'",then: [{T: a}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}}]},{name: divergence,tag: divergence,match: count(*) = 1,replace: [{test: {if: "$Verbosity='Terse'",then: [{T: eltérés}],else: [{T: eltérése}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: curl,tag: curl,match: count(*) = 1,replace: [{T: rotáció},{test: {if: "$Verbosity!='Terse'",then: [{T: a}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: gradient,tag: gradient,match: count(*) = 1,replace: [{test: {if: "$Verbosity!='Terse'",then: [{T: "gradiense ennek:"}],else: [{T: del}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}]
