[{name: laplacian,tag: laplacian,match: count(*) <= 1,replace: [{t: LahPlahsian},{test: {if: count(*) = 1,then: [{test: {if: "$Verbosity!='Terse'",then: [{t: of}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}}]},{name: divergence,tag: divergence,match: count(*) = 1,replace: [{test: {if: "$Verbosity='Terse'",then: [{t: dihv}],else: [{t: divergence of}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: curl,tag: curl,match: count(*) = 1,replace: [{t: curl},{test: {if: "$Verbosity!='Terse'",then: [{t: of}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: gradient,tag: gradient,match: count(*) = 1,replace: [{test: {if: "$Verbosity!='Terse'",then: [{t: gradient of}],else: [{t: del}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}]
