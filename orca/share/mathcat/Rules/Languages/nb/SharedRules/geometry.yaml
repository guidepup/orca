[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: linjestykket fra},{x: "*[1]"},{T: til},{x: "*[2]"}],else: [{T: linjestykke},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: strålen fra},{x: "*[1]"},{T: til},{x: "*[2]"}],else: [{T: stråle},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{T: bue},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{T: størrelsen på vinkelen}],else: [{T: vinkel}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]},{name: coordinate,tag: coordinate,match: ".",replace: [{T: punktet},{test: {if: "$Verbosity='Verbose'",then: [{T: i}]}},{pause: short},{insert: {nodes: "*",replace: [{T: komma},{pause: auto}]}},{pause: short},{test: {if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))",then: [{T: slutt punkt}]}}]}]
