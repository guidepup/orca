[{name: scalar-determinant,tag: determinant,match: "count(*)=1 and not(*[1][self::m:mtr])",replace: [{T: determinanten},{T: til},{x: "*[1]"},{test: {if: "not(IsNode(*[1], 'simple'))",then: [{T: slutt determinant}]}}]},{name: subscripted-norm,tag: subscripted-norm,match: count(*)=2,replace: [{x: "*[2]"},{T: normen},{T: til},{x: "*[1]"}]},{name: homomorphism,tag: homomorphism,match: count(*)=1,replace: [{test: {if: "$Verbosity!='Terse'",then: [{T: mengden av homomorfier på}],else: [{T: homomorfiene på}]}},{x: "*[1]"},{test: {if: "$Impairment = 'Blindness' and not(*[last()][IsBracketed(., '', '') or IsNode(., 'simple')] )",then: [{T: slutt homomorfier}]}},{test: {if: "IsNode(., '2D')",then: [{pause: short}],else: [{pause: auto}]}}]},{name: kernel,tag: kernel,match: count(*)=1,replace: [{T: nullrommet},{T: til},{x: "*[1]"},{test: {if: "$Impairment = 'Blindness' and not(*[last()][IsBracketed(., '', '') or IsNode(., 'simple')] )",then: [{T: slutt nullrommet}]}},{test: {if: "IsNode(., '2D')",then: [{pause: short}],else: [{pause: auto}]}}]},{name: dimension,tag: dimension,match: count(*)=1,replace: [{T: dimensjonen},{T: til},{x: "*[1]"}]},{name: norm,tag: norm,match: count(*)=1,replace: [{T: normen},{T: til},{x: "*[1]"},{test: {if: "not(IsNode(*[1], 'simple'))",then: [{pause: short},{T: slutt norm}]}}]}]
