[{name: overview-default,tag: [mfrac,fraction],match: ".",replace: [{test: {if: "IsNode(*[1], 'simple') and IsNode(*[2], 'simple')",then: [{x: "*[1]"},{T: over},{x: "*[2]"}],else: [{T: brøk}]}}]},{name: overview-default,tag: [msqrt,square-root],match: ".",replace: [{T: kvadratrot},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: av}]}},{x: "*[1]"}]}}]},{name: overview-default,tag: [mroot,root],match: ".",replace: [{test: {if: "*[2][self::m:mn]",then_test: [{if: "*[2][text()='2']",then: [{T: kvadratrot}]},{else_if: "*[2][text()='3']",then: [{T: kubikkrot}]},{else_if: "*[2][not(contains(., ','))]",then: [{x: "ToOrdinal(*[2])"},{T: rot}]}],else: [{T: rot av grad},{x: "*[2]"}]}},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: av}]}},{x: "*[1]"}]}}]},{name: matrix-override,tag: mrow,match: ["*[2][self::m:mtable] and","(IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|'))"],replace: [{x: "count(*[2]/*)"},{T: ganger},{x: "count(*[2]/*[self::m:mtr][1]/*)"},{test: {if: "*[1][.='|']",then: [{T: determinant}],else: [{T: matrise}]}}]},{name: overview-default,tag: mtable,match: ".",replace: [{x: "count(*[2]/*)"},{T: ganger},{x: "count(*[2]/*[self::m:mtr][1]/*)"},{T: tabell}]},{name: short-mrow,tag: mrow,match: count(*)<6,replace: [{insert: {nodes: "*",replace: [{pause: auto}]}}]},{name: long-mrow,tag: mrow,match: ".",replace: [{x: "*[1]"},{pause: auto},{x: "*[2]"},{pause: auto},{x: "*[3]"},{pause: auto},{x: "*[4]"},{pause: auto},{x: "*[5]"},{pause: auto},{T: og så videre}]},{include: SimpleSpeak_Rules.yaml}]
