[{name: line-segment,tag: line-segment,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: ευθύγραμμο τμήμα από},{x: "*[1]"},{t: ως},{x: "*[2]"}],else: [{t: ευθύγραμμο τμήμα},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-ray,tag: ray,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: το διάνυσμα από},{x: "*[1]"},{t: σε},{x: "*[2]"}],else: [{t: διάνυσμα},{x: "*[1]"},{x: "*[2]"}]}}]},{name: geometry-arc,tag: arc,match: count(*)=2,replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: το}]}},{t: τόξο},{x: "*[1]"},{x: "*[2]"}]},{name: measure-of-angle,tag: measure-of-angle,match: count(*)=3,replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: το μέτρο της γωνίας}],else: [{t: μέτρο γωνίας}]}},{x: "*[1]"},{x: "*[2]"},{x: "*[3]"}]},{name: coordinate,tag: coordinate,match: ".",replace: [{test: {if: "$Verbosity='Verbose'",then: [{t: το}]}},{t: σημείο},{test: {if: "$Verbosity='Verbose'",then: [{t: στο}]}},{pause: short},{insert: {nodes: "*",replace: [{t: κόμμα},{pause: auto}]}},{pause: short},{test: {if: "($SpeechStyle='ClearSpeak' and $Verbosity='Verbose') or not(IsNode(*[last()],'leaf'))",then: [{t: τέλος σημείου}]}}]}]
