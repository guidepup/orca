[{name: laplacian,tag: laplacian,match: count(*) <= 1,replace: [{t: Λαπλασιανή},{test: {if: count(*) = 1,then: [{test: {if: "$Verbosity!='Terse'",then: [{t: του}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}}]},{name: divergence,tag: divergence,match: count(*) = 1,replace: [{test: {if: "$Verbosity='Terse'",then: [{t: ντιβ}],else: [{t: απόκλιση του}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: curl,tag: curl,match: count(*) = 1,replace: [{t: στροβιλισμός},{test: {if: "$Verbosity!='Terse'",then: [{t: ""}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]},{name: gradient,tag: gradient,match: count(*) = 1,replace: [{test: {if: "$Verbosity!='Terse'",then: [{t: κλίση}],else: [{t: ανάδελτα}]}},{test: {if: "not(IsNode(*[1], 'leaf'))",then: [{pause: short}]}},{x: "*[1]"}]}]
