[{name: overview-default,tag: mfrac,match: ".",replace: [{test: {if: "IsNode(*[1], 'simple') and IsNode(*[2], 'simple')",then: [{x: "*[1]"},{T: trên},{x: "*[2]"}],else: [{T: phân số}]}}]},{name: overview-default,tag: msqrt,match: ".",replace: [{T: căn bậc hai},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: của}]}},{x: "*[1]"}]}}]},{name: overview-default,tag: mroot,match: ".",replace: [{test: {if: "*[2][self::m:mn]",then_test: [{if: "*[2][.='2']",then: [{T: căn bậc hai}]},{else_if: "*[2][.='3']",then: [{T: căn bậc ba}]},{else_if: "*[2][not(contains(., '.'))]",then: [{T: căn bậc},{x: "ToOrdinal(*[2])"}]}],else: [{test: {if: "*[2][self::m:mi][string-length(.)=1]",then: [{x: "*[2]"}],else: [{x: "*[2]"}]}},{T: căn}]}},{test: {if: "IsNode(*[1], 'simple')",then: [{test: {if: "$Verbosity!='Terse'",then: [{T: của}]}},{x: "*[1]"}]}}]},{name: matrix-override,tag: mrow,match: ["*[2][self::m:mtable] and","(IsBracketed(., '(', ')') or IsBracketed(., '[', ']') or IsBracketed(., '|', '|'))"],replace: [{test: {if: "*[1][.='|']",then: [{T: định thức}],else: [{T: ma trận}]}},{x: "count(*[2]/*)"},{T: nhân},{x: "count(*[2]/*[self::m:mtr][1]/*)"}]},{name: overview-default,tag: mtable,match: ".",replace: [{T: bảng},{x: "count(*[2]/*)"},{T: nhân},{x: "count(*[2]/*[self::m:mtr][1]/*)"}]},{name: short-mrow,tag: mrow,match: count(*)<6,replace: [{insert: {nodes: "*",replace: [{pause: auto}]}}]},{name: long-mrow,tag: mrow,match: ".",replace: [{x: "*[1]"},{pause: auto},{x: "*[2]"},{pause: auto},{x: "*[3]"},{pause: auto},{x: "*[4]"},{pause: auto},{x: "*[5]"},{pause: auto},{T: và vân vân}]},{include: SimpleSpeak_Rules.yaml}]
