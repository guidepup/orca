name: Update Orca

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Get the latest Orca release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(
            curl -fsSL https://download.gnome.org/sources/orca/cache.json |
            jq -r '
              .[2].orca[]
              | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))
            ' |
            sort -V |
            tail -1
          )

          if [ -z "$version" ]; then
            echo "Could not determine latest Orca release"
            exit 1
          fi

          series="${version%.*}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "url=https://download.gnome.org/sources/orca/${series}/orca-${version}.tar.xz" >> "$GITHUB_OUTPUT"

      - name: Skip if already current
        id: current
        shell: bash
        run: |
          set -euo pipefail

          if [ -f version.txt ]; then
            current="$(cat version.txt)"
          else
            current=""
          fi

          if [ "$current" = "${{ steps.release.outputs.version }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.current.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            at-spi2-core \
            cargo \
            dbus \
            dbus-x11 \
            dconf-cli \
            gettext \
            git \
            itstool \
            libatk1.0-0 \
            libei-dev \
            libglib2.0-bin \
            libglib2.0-dev \
            gobject-introspection \
            libgirepository-2.0-dev \
            libgtk-3-dev \
            libtool \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxml2-dev \
            libx11-dev \
            libyelp-dev \
            meson \
            ninja-build \
            orca \
            pulseaudio \
            python-gi-dev \
            python3 \
            python3-brlapi \
            python3-dasbus \
            python3-gi \
            python3-louis \
            python3-lxml \
            python3-pip \
            python3-psutil \
            python3-speechd \
            speech-dispatcher \
            speech-dispatcher-espeak-ng \
            xvfb \
            yelp-tools

      - name: Download Orca
        if: steps.current.outputs.skip != 'true'
        run: |
          curl -fsSL \
            "${{ steps.release.outputs.url }}" \
            -o orca.tar.xz

      - name: Build and install Orca
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf orca _build source
          mkdir source

          tar \
            --extract \
            --file orca.tar.xz \
            --strip-components=1 \
            --directory source

          meson setup \
            _build \
            source \
            --prefix="$GITHUB_WORKSPACE/orca"

          meson compile -C _build
          meson install -C _build

      - name: Initialise Orca defaults
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          pulseaudio \
            --start \
            --exit-idle-time=-1 \
            --log-target=stderr &
          sleep 1

          speech-dispatcher \
            --run-single \
            --timeout 0 &
          sleep 5

          Xvfb :99 &
          export DISPLAY=:99
          sleep 1

          eval "$(dbus-launch --sh-syntax --exit-with-session)"
          sleep 5

          /usr/libexec/at-spi-bus-launcher \
            --launch-immediately &
          sleep 5

          ./orca/bin/orca --version

          timeout 20s \
            ./orca/bin/orca --replace \
            > /tmp/orca.log 2>&1 || true

          cat /tmp/orca.log

      - name: List Orca settings
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          dconf list /org/gnome/orca/ || true
          dconf list /org/gnome/orca/default/ || true

          export GSETTINGS_SCHEMA_DIR="$GITHUB_WORKSPACE/orca/share/glib-2.0/schemas"

          gsettings list-schemas | grep -i orca || true
          gsettings list-relocatable-schemas | grep -i orca || true

          gsettings list-recursively \
            org.gnome.Orca.Braille:/org/gnome/orca/default/braille/ || true

          gsettings list-recursively \
            org.gnome.Orca.CaretNavigation:/org/gnome/orca/default/caret-navigation/ || true

          gsettings list-recursively \
            org.gnome.Orca.Chat:/org/gnome/orca/default/chat/ || true

          gsettings list-recursively \
            org.gnome.Orca.Document:/org/gnome/orca/default/document/ || true

          gsettings list-recursively \
            org.gnome.Orca.Extensions:/org/gnome/orca/default/extensions/ || true

          gsettings list-recursively \
            org.gnome.Orca.FlatReview:/org/gnome/orca/default/flat-review/ || true

          gsettings list-recursively \
            org.gnome.Orca.Keybindings:/org/gnome/orca/default/keybindings/ || true

          gsettings list-recursively \
            org.gnome.Orca.LiveRegions:/org/gnome/orca/default/live-regions/ || true

          gsettings list-recursively \
            org.gnome.Orca.MathPresentation:/org/gnome/orca/default/math-presentation/ || true

          gsettings list-recursively \
            org.gnome.Orca.MouseReview:/org/gnome/orca/default/mouse-review/ || true

          gsettings list-recursively \
            org.gnome.Orca.ProfileMetadata:/org/gnome/orca/default/metadata/ || true

          gsettings list-recursively \
            org.gnome.Orca.Pronunciations:/org/gnome/orca/default/pronunciations/ || true

          gsettings list-recursively \
            org.gnome.Orca.SayAll:/org/gnome/orca/default/say-all/ || true

          gsettings list-recursively \
            org.gnome.Orca.SleepMode:/org/gnome/orca/default/sleep-mode/ || true

          gsettings list-recursively \
            org.gnome.Orca.Sound:/org/gnome/orca/default/sound/ || true

          gsettings list-recursively \
            org.gnome.Orca.Speech:/org/gnome/orca/default/speech/ || true

          gsettings list-recursively \
            org.gnome.Orca.Spellcheck:/org/gnome/orca/default/spellcheck/ || true

          gsettings list-recursively \
            org.gnome.Orca.StructuralNavigation:/org/gnome/orca/default/structural-navigation/ || true

          gsettings list-recursively \
            org.gnome.Orca.SystemInformation:/org/gnome/orca/default/system-information/ || true

          gsettings list-recursively \
            org.gnome.Orca.TableNavigation:/org/gnome/orca/default/table-navigation/ || true

          gsettings list-recursively \
            org.gnome.Orca.TextAttributes:/org/gnome/orca/default/text-attributes/ || true

          gsettings list-recursively \
            org.gnome.Orca.TypingEcho:/org/gnome/orca/default/typing-echo/ || true

          gsettings list-recursively \
            org.gnome.Orca.Voice:/org/gnome/orca/default/voice-sets/primary/default/ || true

          gsettings list-recursively \
            org.gnome.Orca.Voice:/org/gnome/orca/default/voice-sets/primary/uppercase/ || true

          gsettings list-recursively \
            org.gnome.Orca.Voice:/org/gnome/orca/default/voice-sets/primary/hyperlink/ || true

          gsettings list-recursively \
            org.gnome.Orca.Voice:/org/gnome/orca/default/voice-sets/primary/system/ || true

      - name: Dump Orca default settings
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          dconf dump /org/gnome/orca/ > settings.ini

          echo "Generated settings:"
          cat settings.ini

      - name: Cleanup
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          rm -rf orca.tar.xz

      - name: Record version
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          echo "${{ steps.release.outputs.version }}" > version.txt

      - name: Commit and create PR
        if: steps.current.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat: update Orca to ${{ steps.release.outputs.version }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: orca-${{ steps.release.outputs.version }}
          delete-branch: true
          title: Update Orca to ${{ steps.release.outputs.version }}
          body: |
            Automated update.

            Upstream release:
            https://download.gnome.org/sources/orca/${{ steps.release.outputs.series }}/orca-${{ steps.release.outputs.version }}.tar.xz
          assignees: cmorten
          reviewers: cmorten
          draft: false
