name: Update Orca

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Get the latest Orca release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(
            curl -fsSL https://download.gnome.org/sources/orca/cache.json |
            jq -r '
              .[2].orca[]
              | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))
            ' |
            sort -V |
            tail -1
          )

          if [ -z "$version" ]; then
            echo "Could not determine latest Orca release"
            exit 1
          fi

          series="${version%.*}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=https://download.gnome.org/sources/orca/${series}/orca-${version}.tar.xz" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cargo \
            dbus \
            dbus-daemon \
            dbus-x11 \
            gettext \
            git \
            libglib2.0-bin \
            libglib2.0-dev \
            gobject-introspection \
            libgirepository-2.0-dev \
            libgtk-3-dev \
            meson \
            ninja-build \
            pulseaudio \
            python3 \
            python3-brlapi \
            python3-dasbus \
            python3-gi \
            python3-louis \
            python3-lxml \
            python3-pip \
            python3-psutil \
            python3-speechd \
            xvfb

      - name: Download Orca
        run: |
          curl -fsSL \
            "${{ steps.release.outputs.url }}" \
            -o orca.tar.xz

      - name: Build and install Orca
        shell: bash
        run: |
          set -euo pipefail

          rm -rf orca _build source
          mkdir source

          tar \
            --extract \
            --file orca.tar.xz \
            --strip-components=1 \
            --directory source

          meson setup \
            _build \
            source \
            --prefix="$GITHUB_WORKSPACE/orca"

          meson compile -C _build
          meson install -C _build

      - name: Create isolated dconf database
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .dconf
          mkdir -p .dconf

          printf '%s\n' \
            "user-db:guidepup" \
            > .dconf/profile

          touch .dconf/guidepup

      - name: Initialise Orca defaults
        shell: bash
        run: |
          set -euo pipefail

          export DCONF_PROFILE="$GITHUB_WORKSPACE/.dconf/profile"
          export GSETTINGS_SCHEMA_DIR="$GITHUB_WORKSPACE/orca/share/glib-2.0/schemas"

          dconf reset -f /org/gnome/orca/

          pulseaudio \
            --start \
            --exit-idle-time=-1 \
            --log-target=stderr >/dev/null 2>&1 &
          sleep 1

          speech-dispatcher \
            --run-single \
            --timeout 0 >/dev/null 2>&1 &
          sleep 1

          export DISPLAY=:99
          Xvfb :99 >/dev/null 2>&1 &
          sleep 1

          eval "$(dbus-launch --sh-syntax --exit-with-session)"
          sleep 1

          /usr/libexec/at-spi-bus-launcher >/dev/null 2>&1 &
          sleep 1

          ./orca/bin/orca --version

          timeout 10s \
            ./orca/bin/orca --replace \
            > /tmp/orca.log 2>&1 || true

          cat /tmp/orca.log

      - name: Dump Orca settings
        shell: bash
        run: |
          set -euo pipefail

          export DCONF_PROFILE="$GITHUB_WORKSPACE/.dconf/profile"
          export GSETTINGS_SCHEMA_DIR="$GITHUB_WORKSPACE/orca/share/glib-2.0/schemas"

          dconf dump /org/gnome/orca/ > settings.ini

          echo "Generated settings:"
          cat settings.ini

      - name: Record version
        run: |
          echo "${{ steps.release.outputs.version }}" > version.txt

      - name: Commit and create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat: add Orca ${{ steps.release.outputs.version }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: orca-initial
          delete-branch: true
          title: Add Orca ${{ steps.release.outputs.version }}
          body: |
            Initial Orca installation and default settings.

            Upstream release:
            https://download.gnome.org/sources/orca/${{ steps.release.outputs.version }}/orca-${{ steps.release.outputs.version }}.tar.xz
          assignees: cmorten
          reviewers: cmorten
          draft: false
