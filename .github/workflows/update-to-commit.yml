name: Update Orca to Commit

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Upstream Orca commit SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Get the requested Orca commit
        id: commit
        shell: bash
        env:
          ORCA_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [[ ! "$ORCA_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Commit must be a hexadecimal Git SHA (7-40 characters)"
            exit 1
          fi

          git clone https://gitlab.gnome.org/GNOME/orca.git source
          git -C source checkout --detach "$ORCA_COMMIT"

          commit="$(git -C source rev-parse HEAD)"
          short_commit="${commit:0:12}"

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"

      - name: Skip if already current
        id: current
        shell: bash
        run: |
          set -euo pipefail

          if [ -f version.txt ]; then
            current="$(cat version.txt)"
          else
            current=""
          fi

          if [ "$current" = "${{ steps.commit.outputs.commit }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.current.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            at-spi2-core \
            cargo \
            dbus \
            dbus-x11 \
            dconf-cli \
            gettext \
            git \
            itstool \
            libatk1.0-0 \
            libei-dev \
            libglib2.0-bin \
            libglib2.0-dev \
            gobject-introspection \
            libgirepository-2.0-dev \
            libgtk-3-dev \
            libtool \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxml2-dev \
            libx11-dev \
            libyelp-dev \
            meson \
            ninja-build \
            orca \
            pulseaudio \
            python-gi-dev \
            python3 \
            python3-brlapi \
            python3-dasbus \
            python3-gi \
            python3-louis \
            python3-lxml \
            python3-pip \
            python3-psutil \
            python3-speechd \
            speech-dispatcher \
            speech-dispatcher-espeak-ng \
            xvfb \
            yelp-tools

      - name: Build and install Orca
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf orca _build

          meson setup \
            _build \
            source \
            --prefix="$GITHUB_WORKSPACE/orca"

          meson compile -C _build
          meson install -C _build

      - name: Make the build relocatable
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 ./makeRelocatable.py "$GITHUB_WORKSPACE/orca"

      - name: Create guidepup.ini settings file
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ./createSettingsIni.sh

      - name: Cleanup
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

      - name: Record version
        if: steps.current.outputs.skip != 'true'
        shell: bash
        run: |
          echo "${{ steps.commit.outputs.commit }}" > version.txt

      - name: Commit and create PR
        if: steps.current.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat: update Orca to ${{ steps.commit.outputs.short_commit }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: orca-commit-${{ steps.commit.outputs.short_commit }}
          delete-branch: true
          title: Update Orca to commit ${{ steps.commit.outputs.short_commit }}
          body: |
            Manual update to an upstream Orca commit.

            Upstream commit:
            https://gitlab.gnome.org/GNOME/orca/-/commit/${{ steps.commit.outputs.commit }}
          assignees: cmorten
          reviewers: cmorten
          draft: false
